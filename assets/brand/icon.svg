<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- EV Charge Log icon: lightning bolt (charging) in front of a receipt (logging).
       Source for custom_components/ev_charge_log/brand/*.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bb673"/>
      <stop offset="1" stop-color="#0e7f6a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Receipt with a zigzag bottom edge -->
  <path d="M120 52 h86 a10 10 0 0 1 10 10 v136
           l-12 -10 l-12 10 l-12 -10 l-12 10 l-12 -10 l-12 10 l-12 -10 l-12 10
           v-136 a10 10 0 0 1 10 -10 z"
        fill="#ffffff"/>
  <rect x="136" y="80" width="64" height="11" rx="5.5" fill="#0e7f6a"/>
  <rect x="136" y="104" width="46" height="11" rx="5.5" fill="#0e7f6a" opacity="0.55"/>
  <rect x="136" y="128" width="58" height="11" rx="5.5" fill="#0e7f6a" opacity="0.55"/>
  <rect x="156" y="156" width="44" height="13" rx="6.5" fill="#0e7f6a"/>

  <!-- Lightning bolt, outlined so it stands out against the receipt -->
  <path d="M104 34 L46 140 H92 L72 222 L156 104 H110 L136 34 Z"
        fill="#ffd23f" stroke="#0b5e4f" stroke-width="7" stroke-linejoin="round"/>
</svg>
