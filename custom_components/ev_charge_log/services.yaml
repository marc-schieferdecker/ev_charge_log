add_session:
  fields:
    vehicle:
      required: true
      selector:
        device:
          filter:
            - integration: ev_charge_log
              model_id: vehicle
    energy_kwh:
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          unit_of_measurement: kWh
          mode: box
    charge_type:
      required: true
      default: ac
      selector:
        select:
          translation_key: charge_type
          options:
            - ac
            - dc
    tariff:
      selector:
        device:
          filter:
            - integration: ev_charge_log
              model_id: tariff
    cost:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    timestamp:
      selector:
        datetime:
    soc_start: &soc
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: box
    soc_end: *soc
    location: &text
      selector:
        text:
    note: *text

update_session:
  fields:
    vehicle:
      required: true
      selector:
        device:
          filter:
            - integration: ev_charge_log
              model_id: vehicle
    session_id: *text
    energy_kwh:
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          unit_of_measurement: kWh
          mode: box
    energy_from_soc:
      selector:
        boolean:
    charge_type:
      selector:
        select:
          translation_key: charge_type
          options:
            - ac
            - dc
    tariff:
      selector:
        device:
          filter:
            - integration: ev_charge_log
              model_id: tariff
    cost:
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          mode: box
    clear_cost:
      selector:
        boolean:
    timestamp:
      selector:
        datetime:
    soc_start: *soc
    soc_end: *soc
    clear_soc_start:
      selector:
        boolean:
    clear_soc_end:
      selector:
        boolean:
    location: *text
    note: *text

delete_session:
  fields:
    vehicle:
      required: true
      selector:
        device:
          filter:
            - integration: ev_charge_log
              model_id: vehicle
    session_id: *text

list_sessions:
  fields:
    vehicle:
      selector:
        device:
          filter:
            - integration: ev_charge_log
              model_id: vehicle
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:

set_odometer_start:
  fields:
    vehicle:
      required: true
      selector:
        device:
          filter:
            - integration: ev_charge_log
              model_id: vehicle
    odometer:
      required: true
      selector:
        number:
          min: 0
          max: 9999999
          step: 1
          mode: box
    since:
      required: true
      selector:
        date:
