[project]
name = "ev_charge_log"
version = "0.1.0"
requires-python = ">=3.14"
# Runtime requirement of the integration (keep in sync with manifest.json).
dependencies = [
    "fpdf2==2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8",
    # Time zone data for zoneinfo on Windows (Linux has it from the system).
    "tzdata",
    # Reads the text of generated PDFs in the tests.
    "pypdf",
]
# Home Assistant test harness; Linux only (run in WSL or CI).
ha = [
    "pytest-homeassistant-custom-component",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Required by pytest-homeassistant-custom-component.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
